/* ============ init ============ */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 老数据（只记了 done 布尔值）迁移成三态 */
function migrate(){
  Object.keys(db.days||{}).forEach(k=>{
    const day=db.days[k]||{};
    Object.keys(day).forEach(sid=>{
      (day[sid]||[]).forEach(x=>{
        if(x.status===undefined)x.status=x.done?'done':null;
        delete x.done;
      });
    });
  });
}

/* 键盘防遮挡：把界面高度锁到「看得见的区域」，键盘弹起时整体收缩 */
(function viewportFit(){
  const root=document.documentElement;
  const vv=window.visualViewport;
  let lastH=0;
  function sync(){
    const h=Math.round(vv?vv.height:window.innerHeight);
    const t=Math.round(vv?vv.offsetTop:0);
    if(h===lastH&&root.style.getPropertyValue('--vvt')===t+'px')return;
    lastH=h;
    root.style.setProperty('--vvh',h+'px');
    root.style.setProperty('--vvt',t+'px');
  }
  sync();
  if(vv){
    vv.addEventListener('resize',sync);
    vv.addEventListener('scroll',sync);
  }
  window.addEventListener('resize',sync);
  window.addEventListener('orientationchange',()=>setTimeout(sync,300));

  // 聚焦后把输入框滚到中间，键盘动画一般 300ms 左右
  function reveal(el){
    if(!el||!el.scrollIntoView)return;
    const r=el.getBoundingClientRect();
    const h=(vv?vv.height:window.innerHeight);
    // 已经在可视区里就别乱跳
    if(r.top>=64&&r.bottom<=h-24)return;
    try{el.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){try{el.scrollIntoView()}catch(e2){}}
  }
  document.addEventListener('focusin',ev=>{
    const el=ev.target;
    if(!el||!el.matches||!el.matches('input,textarea,select'))return;
    [60,320,640].forEach(t=>setTimeout(()=>{sync();reveal(el)},t));
  });
  document.addEventListener('focusout',()=>setTimeout(sync,120));
})();

/* ============ 主题色 ============ */
const THEMES=[
  ['#3FA98A','薄荷'],['#4E9FD1','天青'],['#5E9E6B','抹茶'],['#8C7BC9','雾紫'],
  ['#E08A76','蜜桃'],['#D5A03C','杏黄'],['#C77B8B','豆沙'],['#3F6F8C','墨蓝']
];
const THEME_DEF='#3FA98A';
function hx2rgb(h){
  h=String(h||'').replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  if(h.length!==6||/[^0-9a-fA-F]/.test(h))h='3FA98A';
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function rgb2hx(a){return '#'+a.map(v=>('0'+Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2)).join('')}
function mixHex(a,b,t){const A=hx2rgb(a),B=hx2rgb(b);return rgb2hx([0,1,2].map(i=>A[i]*(1-t)+B[i]*t))}
function shadeHex(a,t){return rgb2hx(hx2rgb(a).map(v=>v*(1-t)))}
function lumHex(a){
  const c=hx2rgb(a).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});
  return .2126*c[0]+.7152*c[1]+.0722*c[2];
}
/* 一个主色，推出浅底、描边、深字、页面底色 */
function applyBrand(c){
  const hex=/^#[0-9a-fA-F]{6}$/.test(c||'')?c:THEME_DEF;
  const de=document.documentElement.style;
  de.setProperty('--brand',hex);
  de.setProperty('--brand-soft',mixHex(hex,'#FFFFFF',.90));
  de.setProperty('--brand-tint',mixHex(hex,'#FFFFFF',.79));
  de.setProperty('--brand-line',mixHex(hex,'#FFFFFF',.70));
  de.setProperty('--brand-deep',shadeHex(hex,.30));
  de.setProperty('--brand-ink',lumHex(hex)>.33?'#1E2A24':'#FFFFFF');
  const bg=mixHex(hex,'#F7F9F4',.955);
  de.setProperty('--bg',bg);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',bg);
}
function saveBrand(c){
  if(!db.prefs)db.prefs={};
  db.prefs.brand=c;
  try{save()}catch(e){}
}
function themeSheet(){
  const cur=String(db.prefs.brand||THEME_DEF).toLowerCase();
  let body='<div class="theme-grid">';
  THEMES.forEach(t=>{
    body+='<button class="sw" data-act="set-brand" data-c="'+t[0]+'" aria-pressed="'+(t[0].toLowerCase()===cur?'true':'false')+'">'+
          '<i style="--sw:'+t[0]+'"></i><span>'+t[1]+'</span></button>';
  });
  body+='</div>';
  body+='<label class="theme-custom">'+
        '<input type="color" id="brandPick" value="'+(/^#[0-9a-fA-F]{6}$/.test(cur)?cur:THEME_DEF)+'">'+
        '<span class="cf"><b>自己挑一个颜色</b><small>点左边色块，整个界面跟着变，浅色深色都能用</small></span>'+
        '</label>';
  body+='<p class="theme-note">只改这台手机上的颜色，随时能换回来。</p>';
  openSheet({title:'换颜色',body,
    onMount(wrap){
      const pick=wrap.querySelector('#brandPick');
      if(!pick)return;
      pick.oninput=()=>{
        applyBrand(pick.value);
        wrap.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed','false'));
      };
      pick.onchange=()=>saveBrand(pick.value);
    }});
}

/* ============ 装到桌面：唯一能真正「全屏 + 锁竖屏」的路 ============ */
/* 为什么不再用网页全屏（Fullscreen API）：
   手机浏览器进全屏后会把它当看视频的场景，自己把画面转成横的；screen.orientation.lock()
   在绝大多数安卓浏览器和微信里根本没有实现，锁不住。所以全屏这条路在网页里是死路。
   装到桌面（PWA）是系统级窗口，方向由 manifest 的 orientation:portrait 决定，
   从图标打开就是竖屏全屏、没有地址栏，任何浏览器都改不了它。 */
(function appMode(){
  const de=document.documentElement;
  const ua=navigator.userAgent||'';
  const inWeChat=/MicroMessenger/i.test(ua);
  const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isStandalone=()=>{
    try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}catch(e){return false}
  };
  const btn=document.getElementById('fsBtn');
  const bar=document.getElementById('installBar');
  const BAR_NO='hwbook.noInstallBar';
  const SVG_HOME='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v10M8.2 10l3.8 3.8L15.8 10"/><path d="M4.5 15.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></svg>';

  let evt=null;

  function fireInstall(){
    if(!evt){installSheet();return}
    evt.prompt();
    evt.userChoice.then(c=>{
      if(c&&c.outcome==='accepted')toast('装好了，去桌面找「作业登记」');
      evt=null;de.classList.remove('can-install');paintBar();
    }).catch(()=>{});
  }

  function stepsText(){
    if(inWeChat)return '微信里装不了。点右上角 <b>···</b> → <b>在浏览器打开</b>，再回来点这个按钮。';
    if(isIOS)return '点底部中间的 <b>分享</b> 按钮（方框带箭头）→ 往下滑找到 <b>添加到主屏幕</b> → 点右上角「添加」。';
    return '点浏览器右上角的 <b>⋮</b> → 选 <b>添加到主屏幕</b>（有的手机叫「安装应用」）。';
  }

  function installSheet(){
    const body='<p style="font-size:13.5px;color:var(--ink-2);line-height:1.75;margin:2px 0 12px">'+
        '装到桌面后，从桌面图标打开：<b>没有地址栏，固定竖屏，永远不会转成横的</b>，跟下载的 App 一模一样。'+
      '</p>'+
      '<p style="font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 16px">'+
        '顺带说清楚：网页里的「全屏」是手机浏览器说了算，它会把画面当视频自动转横，谁也锁不住——所以那个按钮我换成这个了。'+
      '</p>'+
      (evt
        ? '<button class="btn-primary" id="doInstall" type="button" style="width:100%;height:46px">立即装到桌面</button>'
        : '<div style="border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:13px 14px;font-size:13px;color:var(--ink-2);line-height:1.75">'+stepsText()+'</div>');
    openSheet({
      title:'装到桌面当 App',
      body:body,
      foot:'<button class="btn-line" data-close="1" style="flex:1;height:46px;font-size:14px">知道了</button>',
      onMount(wrap){
        const b=wrap.querySelector('#doInstall');
        if(b)b.onclick=fireInstall;
      }
    });
  }

  function paintBtn(){
    if(!btn)return;
    const hide=isStandalone();
    btn.style.display=hide?'none':'grid';
    if(hide)return;
    btn.innerHTML=SVG_HOME;
    btn.setAttribute('aria-label','装到桌面');
    btn.setAttribute('title','装到桌面当 App 用');
  }

  if(btn){
    paintBtn();
    btn.addEventListener('click',()=>{
      if(evt){fireInstall();return}
      installSheet();
    });
  }

  /* 顶栏下的安装横幅 */
  function paintBar(){
    if(!bar)return;
    if(isStandalone()||localStorage.getItem(BAR_NO)){bar.classList.remove('show');bar.innerHTML='';return}
    if(evt){
      bar.innerHTML='<span>装到桌面后，从图标打开就是竖屏全屏，跟 App 一样，不会再横。</span>'+
        '<button type="button" data-install>装到桌面</button>'+
        '<button type="button" class="ib-close" data-ib-close aria-label="不再提示">×</button>';
      bar.classList.add('show');
    }else if(inWeChat){
      bar.innerHTML='<span>想当 App 全屏用：点右上角「···」→ 在浏览器打开，再装到桌面。</span>'+
        '<button type="button" class="ib-close" data-ib-close aria-label="不再提示">×</button>';
      bar.classList.add('show');
    }else if(isIOS){
      bar.innerHTML='<span>想让它是全屏 App：点底部「分享」→ 添加到主屏幕，装完就是竖屏全屏。</span>'+
        '<button type="button" class="ib-close" data-ib-close aria-label="不再提示">×</button>';
      bar.classList.add('show');
    }
  }

  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();
    evt=e;
    de.classList.add('can-install');
    paintBar();
  });
  document.addEventListener('click',e=>{
    if(!e.target.closest)return;
    if(evt&&e.target.closest('[data-install]')){
      evt.prompt();
      evt.userChoice.then(()=>{evt=null;de.classList.remove('can-install');paintBar()}).catch(()=>{});
      return;
    }
    if(e.target.closest('[data-ib-close]')){
      try{localStorage.setItem(BAR_NO,'1')}catch(err){}
      bar.classList.remove('show');
    }
  });
  window.addEventListener('appinstalled',()=>{
    evt=null;
    de.classList.remove('can-install');
    paintBar();
    paintBtn();
    toast('已装到桌面，从图标进就是竖屏全屏');
  });
  paintBar();
})();

load();
migrate();
applyBrand((db.prefs&&db.prefs.brand)||THEME_DEF);
if(db.students.length)ui.sid=db.students[0].id;
render();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}

})();
</script>
